---
layout: default
---

<article>

  <h1 style="margin-bottom: 8px;">
    {{ page.title }}
  </h1>

  <div style="opacity: 0.7; font-size: 0.9rem; margin-bottom: 24px;">
    {{ page.date | date: "%Y-%m-%d" }}
    {% if page.tags %}
      — {{ page.tags | join: ", " }}
    {% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="back-link" style="margin-top: 40px;">
    <a href="/blog">← back</a>
  </div>

</article>
